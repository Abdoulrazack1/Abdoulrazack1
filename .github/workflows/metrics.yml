name: Statistiques du profil

# Régénère assets/stats.svg chaque jour (contributions, commits, dépôts, langages),
# dans l'identité du profil. Les autres visuels se refont à la main : python scripts/build.py
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: Générer la carte de statistiques
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --stats
      - name: Publier si elle a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "Statistiques du profil mises à jour" && git push)
