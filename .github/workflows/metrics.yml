name: Metrics
on:
  # Refresh tous les jours à 5h00 UTC
  schedule:
    - cron: "0 5 * * *"
  # Au push sur main (mise à jour immédiate)
  push:
    branches: [main]
  # Trigger manuel depuis l'onglet Actions
  workflow_dispatch:

# Le workflow doit pouvoir committer les SVG générés
permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Carte principale (commits, PR, langs, repos, followers, stars) ──
      - name: Main card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          config_padding: 0, 8px
          template: classic

      # ── Carte langages ──
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics-langs.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          config_timezone: Europe/Paris

      # ── Carte achievements (trophées, badges) ──
      - name: Achievements card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics-achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          config_timezone: Europe/Paris

      # ── Carte habitudes (heures + jours de commit) ──
      - name: Habits card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: github-metrics-habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Europe/Paris
